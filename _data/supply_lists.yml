- id: fourth-grade
  grade_en: Fourth grade
  grade_es: Cuarto grado
  image: /assets/supply-lists/2026_4th_grade.jpg
  source_title: Cheney Elementary School Fourth Grade Supply List
  source_title_es: Lista de útiles de cuarto grado de Cheney Elementary School
  intro:
    - "Headphones must last all year; parents are responsible for replacing them. They are needed for every subject, testing, and tutoring. Do not send them in a box or package. Write your child's name on them and send them in a large Ziploc bag."
  intro_es:
    - "Los audífonos deben durar todo el año; los padres son responsables de reemplazarlos. Se necesitan para todas las materias, exámenes y tutorías. No los envíe en una caja o paquete. Escriba el nombre de su hijo en ellos y envíelos en una bolsa Ziploc grande."
  groups:
    - title: Supply list
      title_es: Lista de útiles
      items:
        - 1 pair of headphones — no Bluetooth or earbuds
        - 1 zipper pencil pouch
        - 1 wide-ruled marble composition notebook for English language arts
        - 1 wide-ruled spiral notebook for math
        - "4 plastic two-pocket folders: 2 for English language arts, 1 for math, and 1 for take-home work"
        - "2 to 4 packs of 24-count, pre-sharpened #2 pencils. Wooden yellow pencils only."
        - 2 to 4 packs of EXPO dry erase markers
        - 1 package of Elmer's glue sticks
        - 1 to 2 reams of white copy paper
      items_es:
        - 1 par de audífonos de diadema — no Bluetooth ni auriculares de botón
        - 1 estuche con cierre para lápices
        - 1 cuaderno de composición tipo mármol con renglones anchos para Lengua y Literatura en Inglés
        - 1 cuaderno de espiral con renglones anchos para matemáticas
        - "4 carpetas de plástico con dos bolsillos: 2 para Lengua y Literatura en Inglés, 1 para matemáticas y 1 para trabajos que se llevan a casa"
        - "De 2 a 4 paquetes de lápices número 2, con 24 unidades y con punta. Solo lápices amarillos de madera."
        - De 2 a 4 paquetes de marcadores EXPO de borrado en seco
        - 1 paquete de barras de pegamento Elmer's
        - De 1 a 2 resmas de papel blanco para copias
    - title: Classroom extras
      title_es: Artículos adicionales para el salón
      items:
        - Boxes of tissues
        - Refill liquid soap
        - Disinfecting wipes
        - Colored pencils
        - Gallon- and quart-size Ziploc bags
        - Thin colored markers
      items_es:
        - Cajas de pañuelos desechables
        - Repuesto de jabón líquido
        - Toallitas desinfectantes
        - Lápices de colores
        - Bolsas Ziploc de un galón y de un cuarto de galón
        - Marcadores delgados de colores
  closing:
    - Bring the items to Meet the Teacher in a labeled bag.
  closing_es:
    - Lleve los artículos a Conozca al Maestro en una bolsa etiquetada.

