- id: pre-k
  grade_en: Pre-K
  grade_es: Pre-K
  image: /assets/supply-lists/2026_pre_k.jpg
  source_title: Cheney Elementary Pre-Kindergarten Wishlist 2026-2027
  intro:
    - "Your child will need the following items. Please label these items with your child's name."
  groups:
    - title: Required items
      items:
        - Reusable water bottle
        - Plastic resting mat
        - Small blanket for rest time
        - Set of headphones (no earbuds)
        - "Complete change of clothes labeled with your child's name: shirt, shorts or pants, socks, and underwear. This will be kept at school to be used as needed."
        - Full-sized backpack (no wheels)
    - title: Optional
      items:
        - "Lunch box, if your child will bring lunch from home. The school does not have a microwave or refrigerator for lunches."
    - title: Voluntary donations — please do not put names on these items
      items:
        - Antibacterial hand soap
        - Hand sanitizer
        - Copy paper
        - Baby wipes
        - Tissues
        - Spiral notebook
        - Construction paper
        - Play-Doh
        - Plastic cups — any size and any color
        - Crayons — 24 count
        - Glue sticks
        - Dry erase markers
        - Ziploc bags — any size
        - Disinfecting wipes
        - Watercolor paints
        - Washable markers
        - Colored pencils
        - A box of healthy snacks to share with the class of 20 students

- id: kindergarten
  grade_en: Kindergarten
  grade_es: Kindergarten
  image: /assets/supply-lists/2026_kindergarten.jpg
  source_title: Cheney Elementary Kindergarten Supply List
  intro:
    - Supplies will be shared within the classroom.
    - "Please do not label items with your child's name unless noted."
  groups:
    - title: Supply list
      items:
        - Full-size backpack without wheels (label with name)
        - Reusable water bottle (label with name)
        - "Headphones (label with name). No earbuds or wireless headphones; must have a USB-C-style plug."
        - 24 small glue sticks
        - 2 reams of copy or printer paper
        - 2 boxes of Crayola crayons — 24 count
        - "2 boxes of Classic Color markers — 8 count: 1 skinny and 1 fat"
        - 12 yellow #2 pencils
        - "2 primary composition books. These are different from regular composition books."
        - 2 packs of 4 EXPO dry erase markers — all black preferred
        - 1 box of tissues
        - 1 container of liquid hand soap
        - 1 bottle of hand sanitizer
        - "4 containers of Play-Doh — please do not get a dollar-store brand"

