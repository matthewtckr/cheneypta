        - 1 box of tissues
        - 2 packs of staples
        - 2 rolls of Scotch tape
        - 1 bottle of hand sanitizer
        - 2 containers of disinfecting wipes
        - 1 bottle of hand soap
        - 1 box of Ziploc bags
