- id: pre-k
  grade_en: Pre-K
  grade_es: Pre-K
  image: /assets/supply-lists/2026_pre_k.jpg
  source_title: Cheney Elementary Pre-Kindergarten Wishlist 2026-2027
  source_title_es: Lista de deseos de prekínder de Cheney Elementary 2026-2027
  intro:
    - "Your child will need the following items. Please label these items with your child's name."
  intro_es:
    - "Su hijo necesitará los siguientes artículos. Etiquete estos artículos con el nombre de su hijo."
  groups:
    - title: Required items
      title_es: Artículos requeridos
      items:
        - Reusable water bottle
        - Plastic resting mat
        - Small blanket for rest time
        - Set of headphones (no earbuds)
        - "Complete change of clothes labeled with your child's name: shirt, shorts or pants, socks, and underwear. This will be kept at school to be used as needed."
        - Full-sized backpack (no wheels)
      items_es:
        - Botella de agua reutilizable
        - Colchoneta de plástico para descansar
        - Manta pequeña para la hora de descanso
        - Audífonos de diadema (no auriculares de botón)
        - "Un cambio completo de ropa etiquetado con el nombre de su hijo: camisa, pantalones cortos o largos, calcetines y ropa interior. Se guardará en la escuela para usarlo cuando sea necesario."
        - Mochila de tamaño completo (sin ruedas)
    - title: Optional
      title_es: Opcional
      items:
        - "Lunch box, if your child will bring lunch from home. The school does not have a microwave or refrigerator for lunches."
      items_es:
        - "Lonchera, si su hijo traerá almuerzo de casa. La escuela no tiene microondas ni refrigerador para los almuerzos."
    - title: Voluntary donations — please do not put names on these items
      title_es: Donaciones voluntarias — no escriba nombres en estos artículos
      items:
        - Antibacterial hand soap
        - Hand sanitizer
        - Copy paper
        - Baby wipes
        - Tissues
        - Spiral notebook
        - Construction paper
        - Play-Doh
        - Plastic cups — any size and any color
        - Crayons — 24 count
        - Glue sticks
        - Dry erase markers
        - Ziploc bags — any size
        - Disinfecting wipes
        - Watercolor paints
        - Washable markers
        - Colored pencils
        - A box of healthy snacks to share with the class of 20 students
      items_es:
        - Jabón antibacterial para manos
        - Desinfectante de manos
        - Papel para copias
        - Toallitas húmedas para bebés
        - Pañuelos desechables
        - Cuaderno de espiral
        - Papel de construcción
        - Plastilina Play-Doh
        - Vasos de plástico — de cualquier tamaño y color
        - Crayones — caja de 24
        - Barras de pegamento
        - Marcadores de borrado en seco
        - Bolsas Ziploc — de cualquier tamaño
        - Toallitas desinfectantes
        - Pinturas de acuarela
        - Marcadores lavables
        - Lápices de colores
        - Una caja de refrigerios saludables para compartir con la clase de 20 estudiantes

- id: kindergarten
  grade_en: Kindergarten
  grade_es: Kindergarten
  image: /assets/supply-lists/2026_kindergarten.jpg
  source_title: Cheney Elementary Kindergarten Supply List
  source_title_es: Lista de útiles de kindergarten de Cheney Elementary
  intro:
    - Supplies will be shared within the classroom.
    - "Please do not label items with your child's name unless noted."
  intro_es:
    - Los útiles se compartirán dentro del salón de clases.
    - "No etiquete los artículos con el nombre de su hijo a menos que se indique lo contrario."
  groups:
    - title: Supply list
      title_es: Lista de útiles
      items:
        - Full-size backpack without wheels (label with name)
        - Reusable water bottle (label with name)
        - "Headphones (label with name). No earbuds or wireless headphones; must have a USB-C-style plug."
        - 24 small glue sticks
        - 2 reams of copy or printer paper
        - 2 boxes of Crayola crayons — 24 count
        - "2 boxes of Classic Color markers — 8 count: 1 skinny and 1 fat"
        - 12 yellow #2 pencils
        - "2 primary composition books. These are different from regular composition books."
        - 2 packs of 4 EXPO dry erase markers — all black preferred
        - 1 box of tissues
        - 1 container of liquid hand soap
        - 1 bottle of hand sanitizer
        - "4 containers of Play-Doh — please do not get a dollar-store brand"
      items_es:
        - Mochila de tamaño completo sin ruedas (etiquetar con el nombre)
        - Botella de agua reutilizable (etiquetar con el nombre)
        - "Audífonos de diadema (etiquetar con el nombre). No se permiten auriculares de botón ni audífonos inalámbricos; deben tener un conector USB-C."
        - 24 barras pequeñas de pegamento
        - 2 resmas de papel para copias o impresora
        - 2 cajas de crayones Crayola — 24 unidades
        - "2 cajas de marcadores de colores clásicos — 8 unidades: 1 de punta fina y 1 de punta gruesa"
        - 12 lápices amarillos número 2
        - "2 cuadernos de composición para primaria. Son diferentes de los cuadernos de composición regulares."
        - 2 paquetes de 4 marcadores EXPO de borrado en seco — se prefieren todos negros
        - 1 caja de pañuelos desechables
        - 1 recipiente de jabón líquido para manos
        - 1 botella de desinfectante de manos
        - "4 recipientes de plastilina Play-Doh — no compre una marca de tienda de dólar"

